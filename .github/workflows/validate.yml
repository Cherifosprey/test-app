name: Validate ERP customization

on:
  push:
    branches: [erp-v1]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate customization sources
        run: |
          python -m py_compile scripts/apply_customizations.py
          python -m py_compile scripts/apply_supplier_finance.py
          python -m json.tool custom/erp.config.json > /dev/null
          test -f overrides/frontend/src/config/erpConfig.js
          test -f overrides/frontend/src/utils/currency.js
          test -f overrides/frontend/src/components/PaywallOverlay.jsx
          test -f overrides/frontend/src/pages/admin/ERPPlansPage.jsx
          test -f overrides/frontend/src/pages/settings/CompanySettingsPage.jsx
          test -f overrides/frontend/src/pages/purchases/PurchasesPage.jsx
          test -f overrides/frontend/src/pages/purchases/SupplierFinancePage.jsx
          test -f overrides/frontend/src/pages/payments/PaymentsPage.jsx
          test -f overrides/backend/app/core/erp_settings.py
          test -f overrides/backend/app/core/erp_schema.py
          test -f overrides/backend/app/routers/erp_admin.py
          test -f overrides/backend/app/routers/erp_company.py
          test -f overrides/backend/app/routers/erp_purchases.py
          test -f overrides/backend/app/routers/erp_payments.py
          test -f overrides/backend/app/routers/erp_supplier_finance.py

      - name: Clone SimpleSoft and apply ERP V1
        run: bash scripts/bootstrap.sh

      - name: Validate patched backend and routes
        run: |
          python -m py_compile upstream/backend/app/main.py
          python -m py_compile upstream/backend/app/core/erp_settings.py
          python -m py_compile upstream/backend/app/core/erp_schema.py
          python -m py_compile upstream/backend/app/routers/erp_admin.py
          python -m py_compile upstream/backend/app/routers/erp_company.py
          python -m py_compile upstream/backend/app/routers/erp_purchases.py
          python -m py_compile upstream/backend/app/routers/erp_payments.py
          python -m py_compile upstream/backend/app/routers/erp_supplier_finance.py

          check() {
            needle="$1"
            file="$2"
            if ! grep -Fq "$needle" "$file"; then
              echo "Missing integration: $needle in $file"
              exit 1
            fi
            echo "OK: $needle"
          }

          check "erp_admin.router" upstream/backend/app/main.py
          check "erp_company.router" upstream/backend/app/main.py
          check "erp_purchases.router" upstream/backend/app/main.py
          check "erp_payments.router" upstream/backend/app/main.py
          check "erp_supplier_finance.router" upstream/backend/app/main.py
          check "path: 'purchases'" upstream/frontend/src/router/index.jsx
          check "PurchasesPage" upstream/frontend/src/router/index.jsx
          check "path: 'payments'" upstream/frontend/src/router/index.jsx
          check "PaymentsPage" upstream/frontend/src/router/index.jsx
          check "path: 'supplier-finance'" upstream/frontend/src/router/index.jsx
          check "SupplierFinancePage" upstream/frontend/src/router/index.jsx
          check "module: 'purchases'" upstream/frontend/src/components/layout/Sidebar.jsx
          check "label: 'Paiements'" upstream/frontend/src/components/layout/Sidebar.jsx
          check "label: 'Dettes fournisseurs'" upstream/frontend/src/components/layout/Sidebar.jsx
          check '"purchases"' upstream/backend/app/routers/admin_workspaces.py

      - name: Build patched frontend
        working-directory: upstream/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
