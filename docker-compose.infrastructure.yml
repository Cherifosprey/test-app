services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp_suite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_suite"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - erp_redis_data:/data

volumes:
  erp_postgres_data:
  erp_redis_data:
